<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DPC-Script Audio Editor</title>
    <script>
      // The saved theme, before the first paint, so there is no flash of the other one.
      try {
        document.documentElement.dataset.theme = localStorage.getItem('dpcs-theme') || 'cream';
      } catch (e) {
        document.documentElement.dataset.theme = 'cream';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
